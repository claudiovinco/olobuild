/* UIkit Section overrides */
.olo-template .uk-section-default { background-color: transparent; }
.olo-template .uk-section-primary { background-color: var(--olo-color-primary); color: var(--olo-color-primary-contrast) !important; }
.olo-template .uk-section-primary :where(a) { color: var(--olo-color-primary-contrast) !important; }
.olo-template .uk-section-secondary { background-color: var(--olo-color-secondary); color: var(--olo-color-secondary-contrast) !important; }
.olo-template .uk-section-secondary :where(a) { color: var(--olo-color-secondary-contrast) !important; }
.olo-template .uk-section-muted { background-color: var(--olo-color-muted); color: var(--olo-color-muted-contrast) !important; }

/* Typography overrides */
.olo-template { background-color: var(--olo-color-background); font-size: var(--olo-font-size-base); line-height: var(--olo-line-height); color: var(--olo-color-text); letter-spacing: var(--olo-letter-spacing); font-weight: var(--olo-font-weight-body); }
.olo-template h1, .olo-template .uk-h1 { font-size: var(--olo-font-size-h1); }
.olo-template h2, .olo-template .uk-h2 { font-size: var(--olo-font-size-h2); }
.olo-template h3, .olo-template .uk-h3 { font-size: var(--olo-font-size-h3); }
.olo-template h4, .olo-template .uk-h4 { font-size: var(--olo-font-size-h4); }
.olo-template h5, .olo-template .uk-h5 { font-size: var(--olo-font-size-h5); }
.olo-template h6, .olo-template .uk-h6 { font-size: var(--olo-font-size-h6); }
.olo-template h1, .olo-template h2, .olo-template h3, .olo-template h4, .olo-template h5, .olo-template h6 { font-weight: var(--olo-font-weight-heading); line-height: var(--olo-heading-line-height); letter-spacing: var(--olo-heading-letter-spacing); text-transform: var(--olo-heading-text-transform); }

/* Link overrides */
.olo-template a { color: var(--olo-color-link); text-decoration: var(--olo-link-decoration); }
.olo-template a:hover { text-decoration: var(--olo-link-hover-decoration); }
.olo-template .uk-text-muted { color: var(--olo-color-text-muted) !important; }

/* Button overrides */
.olo-template .uk-button { font-size: var(--olo-btn-font-size); font-weight: var(--olo-btn-font-weight); padding: var(--olo-btn-padding); border-radius: var(--olo-btn-border-radius); text-transform: var(--olo-btn-text-transform); letter-spacing: var(--olo-btn-letter-spacing); }
.olo-template .uk-button:hover { filter: brightness(var(--olo-btn-hover-brightness)); }
.olo-template .uk-button-primary { background-color: var(--olo-color-primary) !important; color: var(--olo-color-primary-contrast) !important; }
.olo-template .uk-button-secondary { background-color: var(--olo-color-secondary) !important; color: var(--olo-color-secondary-contrast) !important; }
.olo-template .uk-button-danger { background-color: var(--olo-color-danger) !important; color: #fff !important; }
.olo-template .uk-button-default { border-radius: var(--olo-btn-border-radius); }

/* Form field overrides */
.olo-template input[type="text"],
.olo-template input[type="email"],
.olo-template input[type="tel"],
.olo-template input[type="number"],
.olo-template input[type="password"],
.olo-template input[type="url"],
.olo-template input[type="date"],
.olo-template input[type="time"],
.olo-template textarea,
.olo-template select {
  background: var(--olo-form-field-bg);
  border: var(--olo-form-field-border);

  padding: var(--olo-form-field-padding);
  font-size: var(--olo-form-field-font-size);
}

}

}

            /* ScrollAssembly — preset Parallax multi-target: piu parti figlie [data-olo-part]
               animate su UN unico progress del genitore [data-olo-assembly]. Additivo: no-op
               senza l'attributo. reduced-motion -> stato finale montato (e=1). */
            (function(){
              var hosts = document.querySelectorAll('[data-olo-assembly]');
              if(!hosts.length) return;
              var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
              var items = [];
              hosts.forEach(function(host){
                var parts = [].slice.call(host.querySelectorAll('[data-olo-part]'));
                parts.forEach(function(el){ el.style.willChange = 'transform,opacity'; });
                items.push({ host: host, parts: parts });
              });
              function frame(){
                var vh = window.innerHeight;
                items.forEach(function(it){
                  var rect = it.host.getBoundingClientRect();
                  var total = (it.host.offsetHeight - vh) || 1;
                  var p = Math.min(1, Math.max(0, (-rect.top) / total));
                  it.parts.forEach(function(el, i){
                    var cfg; try { cfg = JSON.parse(el.dataset.oloPart); } catch(e){ return; }
                    var start = (cfg.start != null ? cfg.start : i * 0.12);
                    var end   = (cfg.end != null ? cfg.end : start + 0.5);
                    var t = Math.min(1, Math.max(0, (p - start) / ((end - start) || 1)));
                    var e = reduce ? 1 : (1 - Math.pow(1 - t, 3));
                    if(cfg.fill != null){ var f0 = cfg.fill[0], f1 = cfg.fill[1]; el.style.height = (f0 + e * (f1 - f0)).toFixed(1) + '%'; return; }
                    var x = (cfg.x || 0) * (1 - e), y = (cfg.y || 0) * (1 - e);
                    var s = 1 + ((cfg.s || 1) - 1) * (1 - e), r = (cfg.r || 0) * (1 - e);
                    el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ') rotate(' + r + 'deg)';
                    if(cfg.fade !== false) el.style.opacity = (0.15 + e * 0.85).toFixed(2);
                  });
                });
              }
              var ticking = false;
              function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(function(){ frame(); ticking = false; }); } }
              window.addEventListener('scroll', onScroll, { passive: true });
              window.addEventListener('resize', onScroll, { passive: true });
              frame();
            })();

(function(){
    "use strict";

    var abElements = document.querySelectorAll("[data-olo-ab-test]");
    if (!abElements.length) return;

    var restUrl = (typeof oloData !== "undefined") ? oloData.restUrl : "/wp-json/";

    abElements.forEach(function(el) {
        var testId = parseInt(el.getAttribute("data-olo-ab-test"), 10);
        var variant = el.getAttribute("data-olo-ab-variant") || "a";
        var goalType = el.getAttribute("data-olo-ab-goal") || "click";
        var goalSelector = el.getAttribute("data-olo-ab-goal-selector") || "";

        if (!testId) return;

        /* Track view */
        fetch(restUrl + "olo/v1/ab-tests/track", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({test_id: testId, variant: variant, event: "view"})
        }).catch(function(){});

        /* Track conversion */
        if (goalType === "click") {
            var target = goalSelector ? el.querySelector(goalSelector) : el;
            if (target) {
                target.addEventListener("click", function() {
                    fetch(restUrl + "olo/v1/ab-tests/track", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({test_id: testId, variant: variant, event: "conversion"})
                    }).catch(function(){});
                }, {once: true});
            }
        }

        if (goalType === "submit") {
            var form = goalSelector ? el.querySelector(goalSelector) : el.querySelector("form");
            if (form) {
                form.addEventListener("submit", function() {
                    fetch(restUrl + "olo/v1/ab-tests/track", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({test_id: testId, variant: variant, event: "conversion"})
                    }).catch(function(){});
                }, {once: true});
            }
        }
    });

(function(){

if(e.key==='Escape'){

});
/* Focus trap for open modals */
document.addEventListener('focusin',function(e){
var m=document.querySelector('.uk-modal.uk-open .uk-modal-dialog');
if(!m)return;
if(!m.contains(e.target)){
var first=m.querySelector('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])');
if(first){first.focus()}
}
});
/* Keep ARIA state in sync with UIkit interactive widgets.
   UIkit toggles .uk-open / .uk-active classes but never updates ARIA,
   so we mirror those into aria-expanded (accordion) and aria-selected (tabs). */
function oloSyncAria(){
var accs=document.querySelectorAll('.uk-accordion > li');
accs.forEach(function(li){
var t=li.querySelector(':scope > .uk-accordion-title');
if(!t||t.__oloAria){return}
t.__oloAria=1;
var upd=function(){t.setAttribute('aria-expanded',li.classList.contains('uk-open')?'true':'false')};
upd();
new MutationObserver(upd).observe(li,{attributes:true,attributeFilter:['class']});
});
document.querySelectorAll('.uk-tab').forEach(function(tl){
tl.setAttribute('role','tablist');
tl.querySelectorAll(':scope > li').forEach(function(li){
var a=li.querySelector('a');
if(!a||a.__oloAria){return}
a.__oloAria=1;
a.setAttribute('role','tab');
var upd=function(){a.setAttribute('aria-selected',li.classList.contains('uk-active')?'true':'false')};
upd();
new MutationObserver(upd).observe(li,{attributes:true,attributeFilter:['class']});
});
});
document.querySelectorAll('.uk-switcher > li').forEach(function(li){
if(!li.__oloAria){li.__oloAria=1;li.setAttribute('role','tabpanel')}
});
}
oloSyncAria();
document.addEventListener('DOMContentLoaded',oloSyncAria);
})();
</script>
